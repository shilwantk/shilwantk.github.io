---
layout: default
---

<main>
  <article class="blog-post-wrapper">
    <header style="margin-bottom: 2rem;">
      <h1 class="h2 article-title">{{ page.title }}</h1>
      <p class="blog-meta">
        {{ page.category | default: "General" }} • {{ page.date | date: "%B %d, %Y" }}
      </p>
      {% if page.image %}
        <img src="{{ page.image }}" alt="{{ page.title }}" style="width: 100%; margin-top: 1rem; border-radius: 12px;" />
      {% endif %}
    </header>

    <section class="blog-post-body">
      {{ content }}
    </section>
  </article>
</main>
