---
layout: default
---

<main>
  <article class="blog-post-wrapper" style="max-width: 720px; margin: 2rem auto; padding: 2rem; background: var(--eerie-black-2); color: var(--white-2); border-radius: 16px;">
    
    <header style="margin-bottom: 2rem;">
      <h1 class="h2 article-title" style="font-size: 2rem;">{{ page.title }}</h1>
      <p class="blog-meta" style="color: var(--light-gray-70); font-size: 0.95rem;">
        {{ page.category | default: "General" }} • {{ page.date | date: "%B %d, %Y" }}
      </p>
      {% if page.image %}
        <img src="{{ page.image }}" alt="{{ page.title }}" style="width: 100%; margin-top: 1rem; border-radius: 12px;" />
      {% endif %}
    </header>

    <section class="blog-post-body" style="line-height: 1.7; font-size: 1.1rem; color: #f0f0f0;">
        {{ content }}
      </section>
    <!-- <section class="blog-post-body" style="line-height: 1.7; font-size: 1.1rem; color: var(--light-gray);">
      {{ content }}
      <pre style="color: white;">DEBUG: Post content rendered.</pre>
    </section> -->
    
  </article>-
</main>
