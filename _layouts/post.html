---
layout: default
---

<article class="blog-post-wrapper" style="padding: 2rem; max-width: 800px; margin: 0 auto; color: white;">

  <header style="margin-bottom: 2rem;">
    <h1 class="h2 article-title" style="font-size: 2rem; font-weight: 600;">{{ page.title }}</h1>
    <p class="blog-meta" style="color: #aaa; font-size: 0.9rem;">
      {{ page.category | default: "General" }} • {{ page.date | date: "%B %d, %Y" }}
    </p>
    {% if page.image %}
      <img src="{{ page.image }}" alt="{{ page.title }}" style="width: 100%; margin-top: 1rem; border-radius: 12px;" />
    {% endif %}
  </header>

  <section class="blog-post-body" style="line-height: 1.6; font-size: 1rem;">
    {{ content }}
  </section>

</article>
